<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | GoodBite Kitchen</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#173653;background:linear-gradient(135deg,#fff0f1,#e7f2ff);display:flex;flex-direction:column}header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:bold;color:#155da5;text-decoration:none}.back{color:#155da5;text-decoration:none;background:white;border:1px solid #155da5;padding:10px 16px;border-radius:24px;font-weight:bold}.card{width:min(440px,92%);margin:45px auto;padding:32px;background:#fff;border-radius:22px;box-shadow:0 12px 35px #173e6815}.card h1{color:#155da5;margin:0 0 8px}.card p{color:#526a82;line-height:1.5}.card label{display:block;font-size:14px;font-weight:bold;margin:14px 0 6px}.card input{width:100%;padding:13px;border:1px solid #c8d8e8;border-radius:9px;font-size:15px}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:25px;background:#e53945;color:white;font-weight:bold;font-size:16px;cursor:pointer}.switch{margin-top:20px;text-align:center}.switch a{color:#d52f42;font-weight:bold}.message{padding:10px;border-radius:8px;background:#fff0f0;color:#b4232e;font-size:14px}footer{text-align:center;color:#627b93;margin-top:auto;padding:22px}@media(max-width:600px){header{padding:18px 5%}.logo{font-size:18px}.card{margin:25px auto;padding:24px}}</style></head><body><header><a class="logo" href="index.html">GoodBite Kitchen</a><nav style="display:flex;gap:8px;flex-wrap:wrap"><a class="back" href="index.html">← Home</a><a class="back" href="login.html">Login</a></nav></header><main class="card"><h1>Create Account</h1><p>Join GoodBite Kitchen and discover your next favourite bite.</p><p id="message" class="message" role="alert" hidden></p><form id="auth-form"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password (at least 6 characters)" minlength="6" required><button class="submit" type="submit">Create Account</button></form><p class="switch">Already have an account? <a href="login.html">Login</a></p></main><footer>Good food. Happy hearts. © GoodBite Kitchen</footer><script>(()=>{
const USERS_KEY='goodbite_demo_users',SESSION_KEY='goodbite_demo_session';
const form=document.getElementById('auth-form'),msg=document.getElementById('message');
const getUsers=()=>{try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch{return []}};
const show=t=>{msg.hidden=false;msg.textContent=t};
const enter=user=>{sessionStorage.setItem(SESSION_KEY,JSON.stringify({name:user.name,email:user.email}));location.href='welcome.html'};
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;
const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
const users=getUsers();const name=document.getElementById('name').value.trim();
  if(password.length<6){show('Password must contain at least 6 characters.');return}
  if(users.some(u=>u.email===email)){show('An account already exists with this email. Please log in.');return}
  const user={name,email,password}; users.push(user); localStorage.setItem(USERS_KEY,JSON.stringify(users)); enter(user);
});
})();</script></body></html>
