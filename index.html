<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodBite Kitchen | Login</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial, sans-serif; color: #163b67;
  background: linear-gradient(135deg, #fff0f1, #e7f2ff);
}
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 7%; gap: 15px;
}
.logo { font-size: 22px; font-weight: bold; color: #155da5; }
nav { display: flex; gap: 10px; }
button, .button {
  display: inline-block; padding: 12px 20px; border: 0; border-radius: 25px;
  font-size: 15px; font-weight: bold; text-decoration: none; cursor: pointer;
}
.login-btn { color: #155da5; background: white; border: 1px solid #155da5; }
.signup-btn { color: white; background: #e53945; }
main {
  width: 88%; max-width: 1100px; min-height: 500px; margin: 25px auto 45px;
  padding: 35px; border-radius: 25px; background: #ffffffd9;
  display: flex; align-items: center; justify-content: space-between; gap: 25px;
  box-shadow: 0 12px 35px #173e6815;
}
.content { flex: 1; }
.tag { color: #d52f42; font-weight: bold; }
h1 { font-size: clamp(42px, 6vw, 70px); line-height: 1; margin: 18px 0; }
h1 span { display: block; color: #e53945; }
p { color: #526a82; font-size: 17px; line-height: 1.7; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
.chef { width: 43%; max-width: 420px; height: auto; }
.auth {
  display: none; width: min(420px, 92%); margin: 0 auto 45px; padding: 28px;
  background: white; border-radius: 20px; box-shadow: 0 12px 35px #173e6815;
}

.auth h2 { margin-top: 0; color: #155da5; }
.auth input {
  width: 100%; margin: 7px 0 14px; padding: 12px; border: 1px solid #c8d8e8;
  border-radius: 9px; font-size: 15px;
}
.auth label { font-size: 14px; font-weight: bold; }
.auth .signup-btn { width: 100%; margin-top: 6px; }
.auth a { color: #d52f42; font-weight: bold; }
footer { text-align: center; padding: 0 15px 25px; color: #627b93; }
@media (max-width: 700px) {
  header { padding: 17px 5%; }
  .logo { font-size: 18px; }
  button, .button { padding: 10px 14px; font-size: 14px; }
  main { flex-direction: column-reverse; width: 92%; padding: 24px; text-align: center; }
  .chef { width: min(280px, 90%); }
  .actions { justify-content: center; }
}
</style>
</head>
